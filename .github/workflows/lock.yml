name: Lock files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write the lock files
        run: |
          for d in apps/desktop apps/android; do
            (cd "$d" && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
          done
      - name: Commit them
        run: |
          git config user.name "sps-search-bot"
          git config user.email "sps-search-bot@users.noreply.github.com"
          git add apps/desktop/package-lock.json apps/android/package-lock.json
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Add package lock files"
            git push
          fi
